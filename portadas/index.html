<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Catálogo de portadas interactivas — Moravi Studio</title>
  <meta name="description" content="La primera pantalla de un negocio, con vida propia: portadas interactivas que se mueven con el cursor o con el dedo.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icono-32.png">
  <link rel="apple-touch-icon" href="/assets/img/icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,300;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/portadas.css?v=8">
  <link rel="stylesheet" href="../css/portadas-wide.css?v=34">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#F3F6FB;color:#0E1A2D;font-family:'Inter',system-ui,sans-serif}
    .wrap{width:min(1560px,calc(100vw - 64px));margin:0 auto;padding:40px 0 90px}
    .back{color:#1E8CFF;text-decoration:none;font-weight:600;font-size:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .lang-selector{display:flex;align-items:center;gap:2px;border:1px solid #dde5f0;background:#fff;border-radius:999px;padding:3px;flex-shrink:0}
    .lang-btn{border:none;background:none;cursor:pointer;font:600 13px 'Inter',system-ui,sans-serif;color:#5C6A7E;padding:5px 11px;border-radius:999px;transition:background .2s ease,color .2s ease}
    .lang-btn:hover{color:#1E8CFF}
    .lang-btn--active,.lang-btn--active:hover{background:#1E8CFF;color:#fff}
    h1{font:700 clamp(30px,4vw,48px)/1.12 'Poppins',sans-serif;margin-top:18px;letter-spacing:-.01em}
    h1 em{font-style:normal;color:#1E8CFF}
    .lead{margin-top:12px;color:#5C6A7E;font-size:18px;max-width:720px;line-height:1.5}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 26px;margin-top:40px}
    .card,.card *{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}.card{background:#fff;border:1px solid #dde5f0;border-radius:22px;padding:12px 12px 20px;box-shadow:0 8px 28px rgba(14,26,45,.07)}
    .card .pw{border-radius:14px}
    .card__row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:16px 8px 0}
    .card__row h2{font:700 19px 'Poppins',sans-serif}
    .tag{display:inline-block;font-size:12px;font-weight:600;color:#1E8CFF;background:rgba(30,140,255,.1);padding:4px 10px;border-radius:99px;white-space:nowrap}
    .card > p{margin:8px 8px 0;color:#5C6A7E;font-size:14px;line-height:1.5}
    .card__go{display:inline-flex;align-items:center;gap:6px;margin:14px 8px 0;font:600 14px 'Inter',sans-serif;color:#0A1B3C;text-decoration:none;border-bottom:2px solid #1E8CFF;padding-bottom:2px}
    .card__go:hover{color:#1E8CFF}
    .soon{margin-top:34px;color:#8a97ab;font-size:14px}
    @media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media (max-width:680px){.wrap{width:calc(100vw - 32px)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap" data-idioma>
    <div class="topbar">
      <a class="back" href="../">← Volver a Moravi Studio</a>
      <div class="lang-selector" role="group" aria-label="Seleccionar idioma">
        <button type="button" class="lang-btn lang-btn--active" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1>Catálogo de portadas <em>interactivas</em></h1>
    <p class="lead">La primera pantalla de un negocio, con vida propia. Cada portada se mueve: pasa el cursor o tócala, y abre la que quieras ver completa.</p>
    <div class="grid" id="grid"></div>
    <p class="soon">Pronto habrá más portadas.</p>
  </div>
  <script src="../js/portadas/idioma.js?v=2"></script>
  <script src="../js/portadas/brasa-burger.js?v=4"></script>
  <script src="../js/portadas/luna-gelato.js?v=12"></script>
  <script src="../js/portadas/origen-cafe.js?v=4"></script>
  <script src="../js/portadas/pulse-fit.js?v=2"></script>
  <script src="../js/portadas/aurea.js?v=2"></script>
  <script src="../js/portadas/zapatilla.js?v=2"></script>
  <script src="../js/portadas/ramo.js?v=9"></script>
  <script src="../js/portadas/chispita-clean.js?v=1"></script>
  <script src="../js/portadas/montar.js?v=42"></script>
  <script>
    (function () {
      var grid = document.getElementById('grid');
      PortadasAnchas.list.forEach(function (p) {
        if (p.hidden) return;
        var card = document.createElement('article'); card.className = 'card'; card.id = p.key;
        var slot = document.createElement('div'); card.appendChild(slot);
        var row = document.createElement('div'); row.className = 'card__row'; row.innerHTML = '<h2>' + p.name + '</h2><span class="tag">' + p.tag + '</span>'; card.appendChild(row);
        if (p.about) { var d = document.createElement('p'); d.textContent = p.about; card.appendChild(d); }
        var a = document.createElement('a'); a.className = 'card__go'; a.href = 'ver.html?c=' + p.key; a.innerHTML = 'Ver portada completa <span aria-hidden="true">→</span>'; card.appendChild(a);
        grid.appendChild(card);
        PortadasAnchas.mount(slot, p.key);
      });
      if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(function () { t.scrollIntoView({ block: 'center' }); }, 300); }
    })();
  </script>
  <script>
    (function () {
      var KEY = 'moravi-site-lang';
      var btns = [].slice.call(document.querySelectorAll('.lang-btn'));
      function marcar() {
        var en = document.documentElement.getAttribute('lang') === 'en';
        btns.forEach(function (b) {
          var on = b.getAttribute('data-lang') === (en ? 'en' : 'es');
          b.classList.toggle('lang-btn--active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }
      btns.forEach(function (b) {
        b.addEventListener('click', function () {
          var lang = b.getAttribute('data-lang');
          try { localStorage.setItem(KEY, lang); } catch (e) { /* sin almacenamiento: solo cambia en esta visita */ }
          document.documentElement.setAttribute('lang', lang);
          marcar();
        });
      });
      marcar();
    })();
  </script>
</body>
</html>
