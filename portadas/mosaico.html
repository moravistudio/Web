<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Mosaico de portadas — prueba local</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/portadas.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#FBFCFE;color:#0E1A2D;font-family:'Inter',system-ui,sans-serif}
    .top{height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 60px;color:#8a97ab;font-size:14px}
    .top i{display:block;width:120px;height:22px;border-radius:6px;background:#cfd8e6}
    .mosaic{width:min(1320px,calc(100vw - 120px));margin:10px auto 60px;aspect-ratio:1320/660;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(6,1fr);gap:12px}
    .tile{border-radius:16px;overflow:hidden;position:relative}
    .tile--link{display:block;color:inherit;text-decoration:none}
    .t{display:flex;flex-direction:column;justify-content:center;padding:0 22px 0 26px;position:relative}
    .t:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:#1E8CFF;border-radius:2px}
    .t h2{font:700 clamp(28px,3.1vw,44px)/1.12 'Poppins',sans-serif;letter-spacing:-.01em}
    .t h2 em{font-style:normal;color:#1E8CFF}
    .t p{margin-top:12px;font-size:clamp(14px,1.2vw,17px);line-height:1.45;color:#5C6A7E}
    .t small{margin-top:12px;font-size:13px;color:#1E8CFF;font-weight:600}
    .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px dashed rgba(10,27,60,.15);font-size:13px;color:rgba(10,27,60,.65)}
    .ph b{font:800 28px 'Poppins',sans-serif;color:rgba(10,27,60,.55)}
    .circle{border-radius:50%}
    .p2{background:#ffe3ee}.p3{background:#efe4d6}.p4{background:#d9ebff}.p5{background:#fff3c4}.p6{background:#d9f3ea}.p7{background:#e3dfff}
  </style>
</head>
<body>
  <div class="top"><i></i><span>Inicio &nbsp; Proyectos &nbsp; Servicios &nbsp; Productos &nbsp; Contacto</span></div>
  <div class="mosaic">
    <div class="t" style="grid-area:1/1/3/5"><h2>Experiencias web<br><em>interactivas</em></h2><p>La primera pantalla de tu negocio, con vida propia</p><small>Toca una portada para ver más →</small></div>
    <a class="tile tile--link" href="index.html#brasa-burger" style="grid-area:1/5/5/9" aria-label="Brasa Burger"><div class="cv cv-burger" id="burger"></div></a>
    <a class="tile tile--link" href="index.html#luna-gelato" style="grid-area:1/9/5/11" aria-label="Luna Gelato"><div class="cv cv-gelato" id="gelato"></div></a>
    <div class="tile ph p3" style="grid-area:1/11/3/13"><b>3</b>Origen Café</div>
    <div class="tile ph p4 circle" style="grid-area:3/11/5/13"><b>4</b>Pulse Fit</div>
    <div class="tile ph p5" style="grid-area:3/1/7/5"><b>5</b>Aurea (próximamente)</div>
    <div class="tile ph p6" style="grid-area:5/5/7/10"><b>6</b>Sonría</div>
    <div class="tile ph p7" style="grid-area:5/10/7/13"><b>7</b>Nido</div>
  </div>
  <script src="../js/portadas/brasa-burger.js"></script>
  <script src="../js/portadas/luna-gelato.js"></script>
  <script>BrasaBurger.init(document.getElementById('burger'));
  LunaGelato.init(document.getElementById('gelato'));</script>
</body>
</html>
