<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="Azahar, cuero y calzado">
  <!-- Logo de la muestra «Azahar» (marca inventada): flor de azahar de cinco pétalos + nombre. Colores de la paleta: terracota #B4532A, oro #C99A52, espresso #2A1D17. -->
  <g transform="translate(4 8)">
    <g>
      <ellipse cx="24" cy="13" rx="6.6" ry="10.5" fill="#B4532A" opacity=".95" transform="rotate(0 24 24)"/>
      <ellipse cx="24" cy="13" rx="6.6" ry="10.5" fill="#B4532A" opacity=".78" transform="rotate(72 24 24)"/>
      <ellipse cx="24" cy="13" rx="6.6" ry="10.5" fill="#B4532A" opacity=".95" transform="rotate(144 24 24)"/>
      <ellipse cx="24" cy="13" rx="6.6" ry="10.5" fill="#B4532A" opacity=".78" transform="rotate(216 24 24)"/>
      <ellipse cx="24" cy="13" rx="6.6" ry="10.5" fill="#B4532A" opacity=".95" transform="rotate(288 24 24)"/>
      <circle cx="24" cy="24" r="5.6" fill="#C99A52"/><circle cx="24" cy="24" r="2" fill="#8F3E1D"/>
    </g>
  </g>
  <text x="64" y="40" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="1.4" fill="#2A1D17">Azahar</text>
  <text x="66" y="55" font-family="Inter, Arial, sans-serif" font-size="8.5" letter-spacing="3.2" fill="#7B6A5F">CUERO &amp; CALZADO</text>
</svg>
